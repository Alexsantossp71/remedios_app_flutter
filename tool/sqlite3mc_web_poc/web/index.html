<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQLite3MC encrypted OPFS proof of concept</title>
</head>
<body>
  <h1>SQLite3MC encrypted OPFS proof of concept</h1>
  <pre id="result">RUNNING</pre>
  <script>
    const result = document.querySelector('#result');

    function runWorker(command) {
      return new Promise((resolve, reject) => {
        const worker = new Worker('opfs_worker.dart.js');
        worker.onmessage = (event) => {
          worker.terminate();
          resolve(event.data);
        };
        worker.onerror = (event) => {
          worker.terminate();
          reject(new Error(event.message));
        };
        worker.postMessage(command);
      });
    }

    (async () => {
      try {
        const written = await runWorker('write');
        if (!written.startsWith('PASS:')) throw new Error(written);

        const reopened = await runWorker('verify');
        if (!reopened.startsWith('PASS:')) throw new Error(reopened);

        const wrongKey = await runWorker('wrong-key');
        if (!wrongKey.startsWith('PASS:')) throw new Error(wrongKey);

        result.textContent = 'PASS: ' + written + '\n' + reopened + '\n' + wrongKey;
      } catch (error) {
        result.textContent = 'FAIL: ' + (error?.stack || error);
      }
    })();
  </script>
</body>
</html>
