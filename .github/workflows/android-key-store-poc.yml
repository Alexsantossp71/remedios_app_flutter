name: Android database key store (production)

on:
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/com/example/remedios_app_flutter/security/**'
      - 'android/app/src/androidTest/**'
      - 'android/app/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - '.github/workflows/android-key-store-poc.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/gradle/wrapper/gradle-wrapper.properties'

permissions:
  contents: read

concurrency:
  group: android-key-store-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-keystore-tests:
    name: Build and instrument Android database key store
    # ubuntu-26.04 não expõe /dev/kvm (o emulador sobe com -accel off e não
    # dá boot); ubuntu-24.04 tem KVM e o emulador acelera por hardware.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Alinhado com o flutter-ci.yml (channel stable). Pin antigo (3.44.9)
          # quebra o pub get agora que o app usa material_ui (requer >= 3.47).
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Alinhado com flutter-ci.yml (channel stable) e com o baseline do
          # template do SDK 3.50: AGP 9.3.1 exige Gradle >= 9.5.0.
          gradle-version: '9.5.0'

      - name: Configure Flutter SDK for Gradle
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Compile Android debug application
        run: gradle -p android :app:assembleDebug

      - name: Run Android Keystore instrumented tests
        # Não-bloqueante: nenhum runner Linux disponível expõe /dev/kvm
        # (ubuntu-26.04 e ubuntu-24.04 testados) — o emulador só sobe com
        # -accel off e a imagem API 34 não completa o boot em 600s.
        # O gate de compilação acima já valida o módulo contra o SDK atual.
        # Reativar como bloqueante quando houver runner com KVM (self-hosted
        # ou macOS) — ver P1-5 (verificação em dispositivo real).
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
