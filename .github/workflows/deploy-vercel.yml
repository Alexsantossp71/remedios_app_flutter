name: Deploy to Vercel

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # As chaves de IA (NVIDIA_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY)
      # NÃO entram no build do cliente: vivem só como env vars do projeto na
      # Vercel e são usadas pela função serverless em api/read-card.ts.

      # O build da Vercel NÃO falha em erro de tipo — ele transpila mesmo
      # assim. Sem este gate, uma função com módulo quebrado era implantada
      # com "sucesso" e só quebrava em runtime, como 500 FUNCTION_INVOCATION_FAILED.
      - name: Install and typecheck API
        run: npm ci && npm run typecheck

      - name: Build with Vercel (web + funções)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest build --prod --yes --token="$VERCEL_TOKEN"

      # `vercel deploy` publica os arquivos e reporta sucesso mesmo com a
      # função quebrada: o erro só aparece em runtime, como 500
      # FUNCTION_INVOCATION_FAILED sem mensagem. Este passo carrega o
      # artefato que a Vercel acabou de empacotar e imprime o erro real
      # com stack, barrando o deploy. É o único lugar com VERCEL_TOKEN.
      - name: Verificar que as funções carregam
        run: npm run verify:build

      - name: Deploy with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      # Diagnóstico. O gate carrega o artefato e o handler responde 405,
      # mas a Lambda em produção devolve 500: oLauncher que a Vercel
      # executa NÃO está no artefato (awsLambdaHandler vazio), então o
      # caminho real da requisição não é o testado. Sem o erro de
      # runtime, cada hipótese custa um deploy inteiro.
      - name: Logs de runtime da função
        if: always()
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -o /dev/null -w "GET /api/read-card -> %{http_code}\n" \
            --max-time 30 https://remedios-app-flutter.vercel.app/api/read-card || true
          echo "--- logs do deployment ---"
          timeout 90 npx vercel@latest logs https://remedios-app-flutter.vercel.app \
            --token="$VERCEL_TOKEN" --limit=20 2>&1 \
            || echo "(vercel logs indisponível neste run)"
