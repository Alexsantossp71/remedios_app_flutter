name: Deploy to Vercel

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # As chaves de IA (NVIDIA_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY)
      # NÃO entram no build do cliente: vivem só como env vars do projeto na
      # Vercel e são usadas pela função serverless em api/read-card.ts.
      - name: Build and deploy with Vercel (web + funções)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          npx vercel@latest build --prod --yes --token="$VERCEL_TOKEN"
          && npx vercel@latest deploy --prebuilt --prod --yes
          --token="$VERCEL_TOKEN"
