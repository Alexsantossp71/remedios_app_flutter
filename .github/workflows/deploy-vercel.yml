name: Deploy to Vercel

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # As chaves de IA (NVIDIA_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY)
      # NÃO entram no build do cliente: vivem só como env vars do projeto na
      # Vercel e são usadas pela função serverless em api/read-card.ts.

      # O build da Vercel NÃO falha em erro de tipo — ele transpila mesmo
      # assim. Sem este gate, uma função com módulo quebrado era implantada
      # com "sucesso" e só quebrava em runtime, como 500 FUNCTION_INVOCATION_FAILED.
      - name: Install and typecheck API
        run: npm ci && npm run typecheck

      - name: Build with Vercel (web + funções)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest build --prod --yes --token="$VERCEL_TOKEN"

      # `vercel build` emite o handler em ESM (o arquivo sai com
      # `import ... from`), mas a Lambda carrega /var/task/*.js como CommonJS.
      # O Node morre antes do handler rodar:
      #   SyntaxError: Cannot use import statement outside a module
      # Ou seja, 500 em toda requisição. Não dá para resolver com
      # "type": "module" no package.json: esse campo é copiado para
      # /var/task/package.json e vira o tipo de módulo do diretório inteiro da
      # função, derrubando junto o launcher da plataforma — a função de
      # sondagem, que não importa nada, também deixa de responder.
      # Como o deploy é --prebuilt, o artefato publicado é exatamente o que
      # está em .vercel/output/functions: reempacotar ali é controle direto do
      # formato, sem mexer no runtime. Precisa vir ANTES do gate, para que o
      # gate valide o artefato que realmente será publicado.
      - name: Reempacotar handlers como CommonJS
        run: npm run package:cjs

      # `vercel deploy` publica os arquivos e reporta sucesso mesmo com a
      # função quebrada: o erro só aparece em runtime, como 500
      # FUNCTION_INVOCATION_FAILED sem mensagem. Este passo carrega o
      # artefato que a Vercel acabou de empacotar e imprime o erro real
      # com stack, barrando o deploy. É o único lugar com VERCEL_TOKEN.
      - name: Verificar que as funções carregam
        run: npm run verify:build

      - name: Deploy with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      # Diagnóstico. O gate carrega o artefato e o handler responde 405,
      # mas a Lambda em produção devolve 500: oLauncher que a Vercel
      # executa NÃO está no artefato (awsLambdaHandler vazio), então o
      # caminho real da requisição não é o testado. Sem o erro de
      # runtime, cada hipótese custa um deploy inteiro.
      - name: Logs de runtime da função
        if: always()
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "--- sondas de runtime (200 = launcher OK, 500 = runtime/config) ---"
          for p in /api/ping /api/read-card; do
            curl -s -o /dev/null -w "$p -> %{http_code}\n" \
              --max-time 30 "https://remedios-app-flutter.vercel.app$p" || true
          done
          echo "--- logs do deployment ---"
          # Os logs chegam com atraso: na primeira tentativa, buscar 2s após o
          # curl retornou "No logs found" mesmo com a função já respondendo 500.
          for attempt in 1 2 3; do
            sleep 20
            echo "tentativa $attempt:"
            timeout 60 npx vercel@latest logs https://remedios-app-flutter.vercel.app \
              --token="$VERCEL_TOKEN" --limit=20 2>&1
            sleep 5
          done
