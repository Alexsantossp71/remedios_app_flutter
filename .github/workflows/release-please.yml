name: Release Please

# P3-4 (auditoria): versionamento semântico automatizado a partir dos
# conventional commits (padrão já usado no repositório: feat/fix/refactor/
# chore...). O release-please mantém CHANGELOG.md, abre/mantém um PR
# "chore(master): release X.Y.Z" (com bump em pubspec.yaml) e, quando o PR
# é mergeado, cria a tag vX.Y.Z e a GitHub Release correspondente.
#
# REQUER configuração do repositório: Settings → Actions → General →
# Workflow permissions → marcar "Allow GitHub Actions to create and approve
# pull requests". Sem isso, o release-please falha com "GitHub Actions is
# not permitted to create or approve pull requests."

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
