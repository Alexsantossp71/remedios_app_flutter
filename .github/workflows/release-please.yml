name: Release Please

# P3-4 (auditoria): versionamento semântico automatizado a partir dos
# conventional commits (padrão já usado no repositório: feat/fix/refactor/
# chore...). O release-please mantém CHANGELOG.md, abre/mantém um PR
# "chore(master): release X.Y.Z" (com bump em pubspec.yaml) e, quando o PR
# é mergeado, cria a tag vX.Y.Z e a GitHub Release correspondente.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
