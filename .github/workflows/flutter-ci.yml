name: Flutter CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Keep the committed lockfile in sync with the pinned dependency graph.
      # Only same-repository PR branches are eligible for this maintenance push.
      - name: Commit regenerated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pubspec.lock
            git commit -m 'chore: refresh SQLite dependency lockfile'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify lockfile is reproducible
        run: flutter pub get --enforce-lockfile

      # Keep the generated Web worker and WASM matched to the pinned package
      # versions. This is the regular SQLite build; encryption is not enabled.
      - name: Prepare Web SQLite assets
        run: dart run sqflite_common_ffi_web:setup --force

      # The existing repository has formatting drift across many untouched
      # Dart files. Report it without preventing analyzer/tests/build from
      # running; enforce formatting after a dedicated formatting-only cleanup.
      - name: Report formatting drift
        run: dart format --output=none lib test

      # Existing informational lints are reported but do not block CI.
      # Errors and warnings remain blocking; clean up infos in a dedicated pass.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web release
        run: flutter build web --release
