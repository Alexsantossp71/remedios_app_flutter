name: Flutter CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # P3-1 (auditoria): portabilidade verificada em Linux, macOS e
        # Windows. O build web (e todo o pipeline de cobertura) roda só no
        # lane Linux; nos demais executa pub get + format + analyze + test.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is reproducible
        run: flutter pub get --enforce-lockfile

      # Regenerate the upstream web worker for the pinned package versions,
      # then replace the WASM with the SQLite3MultipleCiphers build and
      # compile the encryption-capable shared worker used by the app.
      - name: Prepare Web SQLite assets (SQLite3MC)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dart run sqflite_common_ffi_web:setup --force
          curl -fsSLo web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.2/sqlite3mc.wasm"
          echo "62a34ec725631c0438e4255ce0c6059099bf8e7fb331e7d4d91a38e075f43a19  web/sqlite3.wasm" | sha256sum -c -
          dart compile js -O2 -o web/sqlite3_mc_sw.js web/sqlite3mc_shared_worker.dart

      # The existing repository has formatting drift across many untouched
      # Dart files. Report it without preventing analyzer/tests/build from
      # running; enforce formatting after a dedicated formatting-only cleanup.
      - name: Report formatting drift
        run: dart format --output=none lib test

      # Existing informational lints are reported but do not block CI.
      # Errors and warnings remain blocking; clean up infos in a dedicated pass.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      # P2-3: make the testing debt visible. Summarizes lcov.info into the job
      # summary, keeps the raw lcov as an artifact and uploads to Codecov
      # (tokenless for public repos; set CODECOV_TOKEN to enable the badge).
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "coverage/lcov.info was not generated (tests likely did not run)"
            exit 0
          fi
          awk -F: '
            /^SF:/ { sf = substr($0, 4) }
            /^LF:/ { lf = substr($0, 4) }
            /^LH:/ { lh = substr($0, 4) }
            /^end_of_record$/ {
              tlf += lf; tlh += lh
              pct = (lf > 0 ? 100 * lh / lf : 0)
              printf "%.1f%% %s (%d/%d lines)\n", pct, sf, lh, lf
            }
          ' coverage/lcov.info | sort -n > coverage_per_file.txt
          TOTAL=$(awk -v t="$tlf" -v h="$tlh" 'BEGIN { if (t > 0) printf "%.1f%%", 100 * h / t; else printf "0.0%%" }')
          {
            echo "## Line coverage (lcov)"
            echo ""
            echo "**Total: ${TOTAL}** (${tlh}/${tlf} lines)"
            echo ""
            echo "<details><summary>20 least covered files</summary>"
            echo ""
            echo '```'
            head -20 coverage_per_file.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Total line coverage: ${TOTAL} (${tlh}/${tlf} lines)"

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 14

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build web release
        if: matrix.os == 'ubuntu-latest'
        run: flutter build web --release
