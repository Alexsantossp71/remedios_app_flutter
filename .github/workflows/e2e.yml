name: E2E (Playwright)

# P3-3 (auditoria): a suíte e2e existia em e2e/ mas nunca rodava em CI.
# Este workflow constrói o Flutter web em modo release, serve o build e
# executa a suíte Playwright (chromium) contra ele.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'e2e/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/e2e.yml'
  push:
    branches: [master, main]
    paths:
      - 'lib/**'
      - 'e2e/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Flutter web + Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Mesmos assets de criptografia do Flutter CI (pinned no pubspec):
      # worker sqlite3mc + shared worker compilado para o build web.
      - name: Prepare Web SQLite assets (SQLite3MC)
        run: |
          dart run sqflite_common_ffi_web:setup --force
          curl -fsSLo web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.2/sqlite3mc.wasm"
          echo "62a34ec725631c0438e4255ce0c6059099bf8e7fb331e7d4d91a38e075f43a19  web/sqlite3.wasm" | sha256sum -c -
          dart compile js -O2 -o web/sqlite3_mc_sw.js web/sqlite3mc_shared_worker.dart

      - name: Build web release
        run: flutter build web --release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # O playwright.config.ts gerencia o próprio servidor (http-server em
      # 127.0.0.1:5000, com reuseExistingServer) e valida que build/web existe.
      #
      # Cobertura: roda tests/setup.spec.ts (5 testes sincronizados à UI de 4
      # abas pós-P2-1). As demais suítes (doctors/medicines/consultations/
      # health-plans) ainda referenciam a UI de 6 abas e foram excluídas até
      # sincronização — ver PR que introduziu este workflow.
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test tests/setup.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
