org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9 torna o Kotlin embutido padrão, mas o ecossistema de plugins do pub
# (ex.: image_picker_android 0.8.x) ainda aplica org.jetbrains.kotlin.android
# nos próprios módulos. Opt-outs transicionais do AGP 9 — remover quando todos
# os plugins forem compatíveis com built-in Kotlin (as duas flags saem no AGP 10):
#   - android.builtInKotlin=false: mantém o KGP como provedor de Kotlin
#   - android.newDsl=false: KGP legado exige a DSL antiga (BaseExtension)
android.builtInKotlin=false
android.newDsl=false
