name: remedios_app_flutter
description: "Remédio na Hora - Flutter implementation."
publish_to: 'none'
version: 3.0.0+0
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.1
  table_calendar: ^3.0.9
  intl: ^0.20.2
  provider: ^6.1.5+1
  uuid: ^4.5.1
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  flutter_local_notifications: ^20.1.0
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.0.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.3
  timezone: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  test: any
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/medicine_catalog.json
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
